.res-Fired{color:var(--accent)} .res-Pass{color:var(--good)} .res-Fail{color:var(--bad)} .res-Advice{color:var(--gold)}

.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.step b{font-size:14px}
.step p{font-size:12.5px;color:var(--muted)}
.step .obj{font-size:12px;border-top:1px dashed var(--line);padding-top:5px}
.seq{margin:0;padding-left:20px;display:grid;gap:6px}
.tree td.code{white-space:nowrap}
.tree .ind{display:inline-block}
.av{font-family:var(--mono);font-weight:500;text-align:center}
.av-M,.av-B{color:var(--good)} .av-O{color:var(--accent)} .av-N{color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.formula{font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:8px;padding:12px 14px;line-height:1.7;overflow-x:auto;white-space:pre}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:8px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.card,.chip,.btn{transition:border-color .15s,background .15s}}

/* ===================== ENGINE: derive → validate → eligibility → recommend → rate → UW ===================== */
function rate(p,tier,si,S,zone){
 const t=tierOf(tier);
 const rows=p.members.map(m=>{const base=m.band.base*C.siFactor[si]*t.factor;const life=C.lifestyle[m.tob].f, pf=C.ped[m.ped].f;return {m,base,life,pf,prem:base*life*pf}});
 const sum=rows.reduce((s,r)=>s+r.prem,0);
 const n=p.members.length, ff=n===1?1:C.floater[Math.min(n,6)];
 const zf=C.zones[zone].factor;
 const effCopay=Math.max(S.copay,p.compCopay);
 const dd=C.volDed[S.ded]||0, cd=C.copay[effCopay]||0;
 const base=sum*ff*zf*(1-dd)*(1-cd);
 const pedSum=rows.filter(r=>C.ped[r.m.ped].st==='CONTROLLED').reduce((s,r)=>s+r.prem,0);
 return {rows,sum,ff,zf,dd,cd,effCopay,base,pedShare:sum?pedSum/sum:0};
}
function addonList(p,tier,S,zone,r,picked){
 const out=[];
 const ctx={p,tier,base:r.base,pedShare:r.pedShare};
 const pp={...p,tier,si:p.si};
 for(const a of ADDONS){
  const av=a.avail[tier];
  if(a.cond&&!a.cond(pp,S)) continue;
  const sug=(a.suggest&&av!=='B')?a.suggest(pp,S,zone):null;
  if(av==='N'&&!sug) continue;
  const opt=a.opts?(picked&&picked[a.code]!=null&&a.opts.includes(picked[a.code])?picked[a.code]:a.opts[0]):null;
  const price=av==='O'?Math.round(a.price(ctx,opt,S)):0;
  out.push({a,av,sug,opt,price,on:av==='O'&&!!(picked&&a.code in picked)});
 }
 return out;
}
function quote(S,opts={}){
 const T=[];const fire=(id,res,scope,detail)=>T.push({id,res,scope,detail});

 const zone=(C.cities.find(c=>c[0]===S.city)||['','B'])[1];
 fire('DRV-04','Fired','Policy',`${S.city} → Zone ${zone} (factor ${C.zones[zone].factor})`);
 // validations
 const rc={};S.members.forEach(m=>rc[m.rel]=(rc[m.rel]||0)+1);
 const dup=Object.entries(rc).filter(([r,c])=>C.relations[r].kind!=='CHILD'&&c>1);
 fire('VAL-02',dup.length?'Fail':'Pass','Policy',dup.length?'Duplicate relationship: '+dup.map(d=>C.relations[d[0]].n).join(', '):'Relationships unique');
 if(dup.length) errors.push('VAL-02: each relationship except child can appear once.');
 if(S.ded&&S.copay){fire('VAL-05','Fail','Policy','Voluntary deductible and co-pay both chosen');errors.push('VAL-05: choose a voluntary deductible or a voluntary co-pay, not both.');}
 else fire('VAL-05','Pass','Policy','Deductible and co-pay are not combined');
 const kids=S.members.filter(m=>C.relations[m.rel].kind==='CHILD').length;
 if(kids>4){fire('ELG-04','Fail','Family','More than 4 children');errors.push('ELG-04: a family floater covers at most 4 children.');}
 if(!S.members.length){errors.push('VAL-01: add at least one person to insure.');fire('VAL-01','Fail','Policy','No insured person');}
 // members: derive + eligibility
 const ms=S.members.map(m=>{const r=C.relations[m.rel];const band=bandOf(m.age);
  const g=r.g||m.g||'M';const nm=r.n+(r.kind==='CHILD'?' ('+m.age+')':'');
  let ok=true,rule='';
  if(r.kind==='ADULT'){rule='ELG-01';ok=m.age>=18&&m.age<=65;}

  if(!ok){fire(rule,'Fail',r.n,`Age ${m.age} is outside the entry age for ${r.kind==='ADULT'?'self/spouse (18–65)':r.kind==='PARENT'?'parents (up to 75)':'dependent children (91 days–25)'}`);fire('UW-01','Fail',r.n,'Decline this member; the rest of the quote continues');}
  return {...m,r,band,g,nm,ok};
 });

  else if(fits.length===1){rec=fits[0];fire('REC-01','Fired',grp.n,`Desired ${siL(des)} falls in the ${rec.t.name} range`);}
  else if(fits.length===2){const hi=p.eldest>=46||p.pedAny;rec=hi?fits[1]:fits[0];
   fire('REC-02','Fired',grp.n,`${siL(des)} is offered by ${fits[0].t.name} and ${fits[1].t.name} → ${rec.t.name} (${hi?'member aged 46+ or with PED':'no member aged 46+ and no PED'})`);}
  if(p.senior&&rec.t.code==='ESS'){rec=p.pk[1];fire('REC-04','Fired',grp.n,`Member aged ${p.eldest} → recommend at least Advantage ${siL(rec.si)} (no room-rent cap, unlimited restoration)`);}
  else if(p.senior) fire('REC-04','Pass',grp.n,`Member aged 60+; ${rec.t.name} already meets the minimum`);
  p.rec=rec;
  const want=S.sel[grp.key];
  p.selPk=(want&&p.pk.find(k=>k.t.code===want&&k.elig))||rec;
  p.tier=p.selPk.t.code;p.si=p.selPk.si;
  // advice

  let sug=C.adequacy[zone]+(mem.length>=3?5*L:0)+(p.eldest>=56?10*L:0);
  const sugSI=allSI.find(v=>v>=sug)||sug;
  if(p.si<sugSI){fire('REC-03','Advice',grp.n,`Suggested SI ${siL(sugSI)} for Zone ${zone}, ${mem.length} member(s), eldest ${p.eldest}`);p.advice.push(['REC-03',`Sum insured looks low. For Zone ${zone}, ${mem.length} member(s) and eldest age ${p.eldest}, we suggest at least ${siL(sugSI)}.`]);}
  if(S.needs.family&&!p.matEligible&&grp.key==='FAM') p.advice.push(['REC-05','Maternity needs a female self or spouse aged 18–45 on this policy.']);
  if(S.needs.family&&p.matEligible&&p.tier==='ESS'){fire('REC-05','Advice',grp.n,'Maternity is not available on Essential');p.advice.push(['REC-05','Maternity cover is available only on Advantage or Elite. Pick Advantage to add it.']);}
  // addons for selected
  p.addons=addonList(p,p.tier,S,zone,p.selPk.r,S.addons[grp.key]);
  p.addons.filter(x=>x.sug).forEach(x=>fire(x.sug[0],'Fired',grp.n,`Suggest ${x.a.n}: ${x.sug[1]}`));
  p.addonSum=p.addons.filter(x=>x.on).reduce((s,x)=>s+x.price,0);
  p.annual=Math.round(p.selPk.r.base)+p.addonSum;

  // UW
  const uw=[];const rank={STP:1,LOAD:2,MED:3,REFER:4};let dec='STP';const up=d=>{if(rank[d]>rank[dec])dec=d};
  mem.forEach(m=>{
   if(m.bmi>40||m.bmi<15){uw.push(['UW-02',m.r.n,`BMI ${m.bmi} outside 15–40 → refer`]);up('REFER');}

   if(pd.st==='CONTROLLED'){uw.push(['UW-03',m.r.n,`${pd.n} → accept with ${Math.round((pd.f-1)*100)}% loading`]);up('LOAD');}

   if(m.tob!=='NONE'){uw.push(['UW-06',m.r.n,`${C.lifestyle[m.tob].n} → ${Math.round((C.lifestyle[m.tob].f-1)*100)}% loading`]);up('LOAD');}

  basketAdvice.push(['REC-12',msg]);fire('REC-12','Advice','Basket',msg);

 return {zone,policies,total,termTotal,T,errors,declined,basketAdvice,dec:decAll};
}

 }

function ratingTrace(p,zone){
 const r=p.selPk.r,t=p.selPk.t;
 let rows=r.rows.map(x=>`<tr><td><span class="rid">RAT-01/02</span></td><td>${x.m.r.n} ${x.m.age} · band ${x.m.band.code}</td><td class="mono">${fmt(x.m.band.base)} × SI ${C.siFactor[p.si]} × ${t.name} ${t.factor} × lifestyle ${x.life} × PED ${x.pf}</td><td class="r num">${fmt(x.prem)}</td></tr>`).join('');
 let v=r.sum*r.ff;
 rows+=`<tr><td><span class="rid">RAT-03</span></td><td>Sum of members × floater factor</td><td class="mono">${fmt(r.sum)} × ${r.ff} (${p.members.length} member${p.members.length>1?'s':''})</td><td class="r num">${fmt(v)}</td></tr>`;
 v*=r.zf;rows+=`<tr><td><span class="rid">RAT-04</span></td><td>Zone factor</td><td class="mono">× ${r.zf} (Zone ${zone})</td><td class="r num">${fmt(v)}</td></tr>`;
 if(r.dd){v*=1-r.dd;rows+=`<tr><td><span class="rid">RAT-05</span></td><td>Voluntary deductible discount</td><td class="mono">× ${(1-r.dd).toFixed(2)} (${fmt(S.ded)})</td><td class="r num">${fmt(v)}</td></tr>`;}
 if(r.cd){v*=1-r.cd;rows+=`<tr><td><span class="rid">RAT-05</span></td><td>${p.compCopay&&r.effCopay===p.compCopay?'Compulsory':'Voluntary'} co-pay discount</td><td class="mono">× ${(1-r.cd).toFixed(2)} (${r.effCopay}% co-pay)</td><td class="r num">${fmt(v)}</td></tr>`;}
 const on=p.addons.filter(x=>x.on);
 on.forEach(x=>rows+=`<tr><td><span class="rid">RAT-06</span></td><td>Add-on: ${x.a.n}</td><td class="mono">${esc(x.a.basis)}</td><td class="r num">+${fmt(x.price)}</td></tr>`);
 rows+=`<tr><td><span class="rid">RAT-07</span></td><td><b>Annual premium</b></td><td></td><td class="r num"><b>${fmt(p.annual)}</b></td></tr>`;
 rows+=`<tr><td><span class="rid">RAT-08</span></td><td>${S.term}-year premium</td><td class="mono">× ${S.term} × ${(1-C.term[S.term]).toFixed(3)}</td><td class="r num">${fmt(p.termPrem)}</td></tr>`;
 rows+=`<tr><td><span class="rid">RAT-09</span></td><td>GST</td><td class="mono">0% (individual and floater health, from 22 Sep 2025)</td><td class="r num">₹0</td></tr>`;
 return `<div class="tbl-wrap"><table><thead><tr><th>Step</th><th>What</th><th>Calculation</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table></div>`;

document.addEventListener('click',e=>{
 const st=e.target.closest('[data-step]');if(st){const s=SCRIPT[+st.dataset.step];const d=s[1]();if(st.dataset.step==='0')prev=null;change(d,true);return;}
 const card=e.target.closest('.card[data-pol]');if(card&&!card.disabled){S.sel[card.dataset.pol]=card.dataset.tier;change(`Customer selected ${tierOf(card.dataset.tier).name} for the ${C.groups.find(g=>g.key===card.dataset.pol).n.toLowerCase()} policy.`);return;}
 if(e.target.id==='b-add'){const rel=document.getElementById('i-addrel').value;if(!rel)return;const r=C.relations[rel];const age=r.kind==='CHILD'?2:r.kind==='PARENT'?62:30;
  S.members.push(mk(rel,age,{g:r.g||'M'}));S.sel={};change(`Added ${r.n}, age ${age}.`,true);return;}
 const rm=e.target.closest('[data-act="rm"]');if(rm){const id=+rm.closest('.member').dataset.id;const m=S.members.find(x=>x.id===id);S.members=S.members.filter(x=>x.id!==id);S.sel={};change(`Removed ${C.relations[m.rel].n}.`,true);}
});
document.addEventListener('input',e=>{
 const el=e.target;if(!document.getElementById('rail')||!el.closest('#rail,#out'))return;
 if(el.dataset.add){const a=S.addons[el.dataset.pol]=S.addons[el.dataset.pol]||{};const ad=ADDONS.find(x=>x.code===el.dataset.add);
  if(el.checked)a[el.dataset.add]=ad.opts?ad.opts[0]:null;else delete a[el.dataset.add];change(`${el.checked?'Added':'Removed'} ${ad.n}.`);return;}
 if(el.dataset.opt){const a=S.addons[el.dataset.pol]=S.addons[el.dataset.pol]||{};a[el.dataset.opt]=+el.value;const ad=ADDONS.find(x=>x.code===el.dataset.opt);change(`${ad.n} limit changed to ${ad.optL(+el.value)}.`);return;}
 const mem=el.closest('.member');
 if(mem){const m=S.members.find(x=>x.id===+mem.dataset.id);const k=el.dataset.k;const r=C.relations[m.rel];
  if(k==='age'||k==='bmi'){if(el.value==='')return;const v=+el.value;if(Number.isNaN(v))return;const o=m[k];m[k]=v;S.sel={};change(`${r.n} ${k==='age'?'age':'BMI'} changed ${o} → ${v}.`);}
  else {m[k]=el.value;const lab=k==='ped'?C.ped[el.value].n:k==='tob'?C.lifestyle[el.value].n:({M:'Male',F:'Female',T:'Transgender'})[el.value];S.sel={};change(`${r.n}: ${({ped:'pre-existing disease',tob:'lifestyle',g:'gender'})[k]} set to ${lab}.`);}
  return;}
 const id=el.id;
 if(id==='i-city'){const z=C.cities.find(c=>c[0]===el.value)[1];S.city=el.value;change(`City changed to ${el.value} (Zone ${z}).`);}
 else if(id==='i-res'){S.res=el.value;S.sel={};change(`Residency set to ${el.value==='NRI'?'NRI':'Resident Indian'}.`);}
 else if(id==='i-occ'){S.occ=+el.value;change(`Self occupation set to class ${el.value}.`);}
 else if(id==='i-si'){const o=S.si;S.si=+el.value;S.sel={};change(`Desired sum insured changed ${siL(o)} → ${siL(S.si)}.`);}
 else if(id==='i-term'){S.term=+el.value;change(`Policy term set to ${el.value} year(s).`);}
 else if(id==='i-ded'){S.ded=+el.value;change(`Voluntary deductible set to ${+el.value?fmt(+el.value):'none'}.`);}
 else if(id==='i-copay'){S.copay=+el.value;change(`Voluntary co-pay set to ${+el.value?el.value+'%':'none'}.`);}
 else if(id==='i-budget'){S.budget=+el.value||0;change(S.budget?`Annual budget set to ${fmt(S.budget)}.`:'Budget cleared.');}
 else if(id.startsWith('n-')){const k={'n-family':'family','n-travel':'travel','n-ci':'ci'}[id];S.needs[k]=el.checked;change(`${({family:'Planning a child',travel:'Travels abroad often',ci:'Family history of critical illness'})[k]}: ${el.checked?'yes':'no'}.`);}
});

  ['Change city','Pincode → RatingZone','DRV-04, REC-03, REC-08','ZONE','Price, suggested SI, consumables suggestion'],
  ['Declare tobacco or alcohol','LifestyleCode','UW-06, RAT-02','LIFESTYLE','Loading and "Accept with loading"'],
  ['Declare a pre-existing disease','PedCode → PedStatus','UW-03/04, REC-02, REC-06, RAT-02','PED_LOADING','Loading or referral; PED buy-back suggested; tier tie-break'],
  ['Change BMI','HeightCm, WeightKg → Bmi','DRV-03, UW-02','—','Referral outside 15–40'],
  ['Change term','PolicyTerm','RAT-08, REC-13','TERM_DISC','Term premium and saving message'],
  ['Choose deductible or co-pay','VolDeductible, VolCopayPct','VAL-05, VAL-10, RAT-05','VOL_DED, VOL_COPAY','Lower price'],
  ['Tick a need (child, travel, CI history)','Quote-context flags','REC-05, REC-07, REC-11','—','Suggested coverages and upgrade advice'],
  ['Set a budget','AnnualBudget','REC-12','All (re-rates with deductibles)','Deductible that fits the budget'],
  ['Residency = NRI','Residency','ELG-07, UW-17','—','Only Elite eligible; medicals']];
 return `<div class="section"><h2>How a customer change flows through the solution</h2>
 <p class="lede">Every input change sends the full quote to the same chain of configured objects. Nothing is hard-coded in the screen: the screen only shows what the rules and rate tables return. This is what lets NxSure change a rule or a rate without a release.</p>
 <div class="pipe">${steps.map((s,i)=>`<div class="panel step"><span class="n">Step ${i+1}</span><b>${s[0]}</b><p>${s[1]}</p><div class="obj mono">${s[2]}</div></div>`).join('')}</div></div>
 <div class="section"><h2>Worked example: the customer adds a 63-year-old father</h2>
 <div class="panel" style="padding:14px 18px"><ol class="seq">
  <li><b>Capture.</b> Journey sends the quote with a new insured person: Relationship FATHER, age 63, controlled hypertension.</li>
  <li><b>Derive.</b> <span class="rid">DRV-02</span> band A5 (61–65). <span class="rid">DRV-05</span> group PAR. <span class="rid">DRV-06</span> a second policy appears: Parents · Individual. <span class="rid">DRV-08</span> senior flag Y.</li>
  <li><b>Eligibility.</b> <span class="rid">ELG-02</span> 63 is within 18–75 → eligible. <span class="rid">ELG-05</span> father cannot join the family floater.</li>
  <li><b>Recommend.</b> ₹10 L is offered by Essential and Advantage, so <span class="rid">REC-02</span> breaks the tie: he is over 46 → Advantage ₹10 L. Had the customer asked for ₹5 L, <span class="rid">REC-01</span> would pick Essential and <span class="rid">REC-04</span>, which has priority, would lift it to Advantage ₹10 L because he is over 60. <span class="rid">REC-06</span> suggests PED buy-back. The family policy keeps its own recommendation (Essential).</li>
  <li><b>Rate.</b> <span class="rid">RAT-01</span> ₹21,500 × 1.45 × 1.20, <span class="rid">RAT-02</span> × 1.10 hypertension, <span class="rid">RAT-04</span> × 1.15 Zone A.</li>
  <li><b>Pre-underwrite.</b> <span class="rid">UW-03</span> accept with loading, <span class="rid">UW-07</span> age ≥ 50 → medicals, <span class="rid">UW-13</span> senior protections.</li>
  <li><b>Respond.</b> The screen shows a second policy card set, a new basket total and a "What changed" list. The family policy is untouched.</li></ol>
  <p style="margin-top:10px"><a href="#demo" class="btn primary" style="text-decoration:none;display:inline-block">Run it in the live quote</a></p></div></div>
 <div class="section"><h2>Change impact matrix</h2><p class="lede">Use this to design test cases: each row is one input, the fields it changes, the rules that must re-run and the rate tables that move the price.</p>
 ${table(['Customer input','Data dictionary fields','Rules re-evaluated','Rate tables','What the customer sees'],impact)}</div>
 <div class="section"><h2>Where each layer runs</h2>
 ${table(['Layer','Recommended home','Why'],[
  ['Product, plans, coverages, DD fields, code tables','InsureMO GI product factory','Single product definition shared by quote, policy, renewal and claims'],
  ['Derivation, validation, eligibility, UW, rating','InsureMO product factory rules and rate tables','Same logic at quote, endorsement and renewal; audited'],
  ['Recommendation (REC rules)','Decision tables in the rule engine if it supports multi-hit results; otherwise a thin journey service reading the same tables (open item O2)','Recommendation is sales logic, not policy logic. It changes more often and must not change a premium.'],
  ['Basket of 2–3 policies, budget fit','Journey / API orchestration layer','A PAS prices one policy at a time; the basket is a sales concept'],
  ['Real-time behaviour','Debounce 300 ms; call Calculate in parallel for up to 3 tiers × 3 policies; cache code tables in the browser','Target under 1 second per change (open item O3)'],
  ['Persistence','Create a quote record only on "Save quote" or "Buy"','Avoids thousands of dead quotes from every keystroke']])}</div>
 <div class="section"><h2>Demo script for NxSure (about 6 minutes)</h2>
 ${table(['Step','Action','What to point out'],[
  ['1','Load "Young family"','Family floater; ₹10 L is offered by two tiers; REC-02 picks Essential because nobody is over 46 and there is no PED; REC-03 advises ₹15 L for a metro family of three.'],
  ['2','Add father, 63, hypertension','A second policy appears (ELG-05). The same ₹10 L now recommends Advantage for him (REC-02, age over 46) while the family stays on Essential. Loading, medicals and senior protections show in the pre-check.'],
  ['3','Add mother, 58','The parents policy becomes a floater; the 15% floater factor lowers the price per person.'],
  ['4','Raise SI to ₹25 L','Both policies move to Advantage ₹25 L (REC-01); UW-07 asks for medicals on the family policy too, because SI ≥ ₹25 L.'],
  ['5','Tick "Planning a child"','Maternity is suggested on the family policy (REC-05), with its 24-month wait.'],
  ['6','Set a budget of ₹1,20,000','REC-12 re-rates with deductibles and names the smallest one that fits.'],
  ['Extra','Set desired SI to ₹5 L with the father on the quote','REC-04 overrides the tier fit: the parents policy is lifted to Advantage ₹10 L because a member is over 60.']])}</div>`;
}
function renderIdentity(){
 return `<div class="section"><h2>Product identity</h2><p class="lede">Product-level settings for the InsureMO GI product definition. Values marked refined differ from the Apex source; see Refinements.</p>
 <div class="panel kv">${IDENTITY.map(r=>`<div>${r[0]}</div><div>${esc(r[1])}</div>`).join('')}</div></div>
 <div class="section"><h2>Plans</h2><div class="grid2">${C.tiers.map(t=>`<div class="panel" style="padding:14px;display:grid;gap:6px"><div class="toolbar"><b style="font-size:16px">${t.name}</b><span class="mono muted">${t.code}</span></div><p class="muted">${t.pitch}</p><div class="mono">SI: ${t.si.map(siL).join(' · ')}</div><div class="mono">Tier factor ${t.factor.toFixed(2)}</div></div>`).join('')}</div></div>
 <div class="section"><h2>Benefit matrix</h2>${table(['Code','Benefit','Essential','Advantage','Elite'],BENEFITS.map(b=>[`<span class="mono">${b[0]}</span>`,b[1],b[2],b[3],b[4]]))}</div>`;
}
function renderTree(){
 return `<div class="section"><h2>Product structure (element tree)</h2><p class="lede">Product → Policy → Policyholder and Insured person (risk) → member coverages; and the shared sum insured plan → core and optional coverages. Availability by tier: <span class="av av-M">M</span> mandatory, <span class="av av-B">B</span> built in, <span class="av av-O">O</span> optional, <span class="av av-N">N</span> not available. Coverage codes keep the Apex source codes.</p>
 ${table(['Element','Code','Type','Cardinality','ESS','ADV','ELT','Configuration notes'],TREE.map(r=>[`<span class="ind" style="padding-left:${r[0]*18}px">${r[0]?'└ ':''}${esc(r[2])}</span>`,`<span class="mono">${r[1]}</span>`,r[3],r[4],...[5,6,7].map(i=>`<span class="av av-${r[i]}">${r[i]}</span>`),esc(r[8])]),'tree')}</div>`;
}
function renderFields(){
 const lv=[...new Set(DD.map(d=>d[0]))];
 return `<div class="section"><h2>Data dictionary fields</h2><p class="lede">Fields by element. Source shows who sets the value. "Used by" links each field to the rules and rate tables that read it, so a change request can be traced to its impact.</p>
 <div class="toolbar"><div class="chips" id="dd-chips"><button class="chip" aria-pressed="true" data-lv="">All (${DD.length})</button>${lv.map(l=>`<button class="chip" aria-pressed="false" data-lv="${l}">${l}</button>`).join('')}</div></div>
 <div id="dd-t">${ddTable('')}</div></div>`;
}
function ddTable(lv){return table(['Element','Field code','Label','Type','Code table','Mandatory','Source','Used by'],DD.filter(d=>!lv||d[0]===lv).map(d=>[d[0],`<span class="mono">${d[1]}</span>`,d[2],d[3],d[4]==='—'?'—':`<span class="mono">${d[4]}</span>`,d[5],d[6],`<span class="mono">${d[7]}</span>`]));}
function renderCodes(){
 return `<div class="section"><h2>Code tables</h2><p class="lede">${CODES.length} code tables. Attributes such as discount, loading or tier list sit on the code so rules and rating read them without hard-coding. ZONE_MAP is a lookup table (iTable) in production, keyed by pincode.</p>
 <div class="grid2">${CODES.map(c=>`<div class="panel" style="padding:12px;display:grid;gap:8px;align-content:start;min-width:0"><div class="toolbar"><b class="mono">${c[0]}</b><span class="muted" style="font-size:12.5px">${esc(c[1])}</span></div>
 <div class="tbl-wrap" style="max-height:260px;overflow:auto"><table><thead><tr><th>Code</th><th>Description</th></tr></thead><tbody>${c[2].map(r=>`<tr><td class="mono">${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}</div></div>`;
}
function renderRules(){
 const sets=[...new Set(RULES.map(r=>r[1]))];
 return `<div class="section"><h2>Business rules catalogue</h2><p class="lede">${RULES.length} rules in execution order: derivation, validation, eligibility, recommendation, underwriting, rating, then renewal and claims. "InsureMO object" uses product factory terms from the Easy PA source (rating formulas, UW rules, validation rules, rate and code tables); exact screen names to be confirmed with the InsureMO GI configuration team.</p>
 <div class="toolbar"><div class="chips" id="r-chips"><button class="chip" aria-pressed="true" data-set="">All</button>${sets.map(s=>`<button class="chip" aria-pressed="false" data-set="${s}">${s} (${RULES.filter(r=>r[1]===s).length})</button>`).join('')}</div>
 <input type="search" id="r-q" placeholder="Search rules" aria-label="Search rules"></div>
 <div id="r-t">${rulesTable('','')}</div></div>`;
}
function rulesTable(set,q){q=q.toLowerCase();return table(['Rule','Set','Stage','Scope','Condition','Outcome','Source','InsureMO object'],RULES.filter(r=>(!set||r[1]===set)&&(!q||r.join(' ').toLowerCase().includes(q))).map(r=>[`<span class="rid">${r[0]}</span>`,r[1],r[2],r[3],esc(r[4]),esc(r[5]),`<span class="muted">${esc(r[6])}</span>`,esc(r[7])]));}
function renderRating(){
 const ex={...base(),members:[mk('SELF',34),mk('SPOUSE',32),mk('SON',4)],si:15*L};
 const q=quote(ex);const p=q.policies[0];const r=p.selPk.r;
 return `<div class="section"><h2>Rating configuration</h2><p class="lede">Community-rated tables by age band, sum insured, tier and zone, as the Apex pricing approach states. All values are illustrative and built to fall in observed Indian market ranges; the Appointed Actuary replaces them before filing.</p>
 <div class="formula">Member premium  = BASE_RATE[AgeBand] × SI_FACTOR[SI] × TIER_FACTOR[Tier] × LIFESTYLE × PED_LOADING      (RAT-01, RAT-02)
Base premium    = Σ member premiums × FLOATER_FACTOR[n] × ZONE × (1 − deductible disc) × (1 − co-pay disc)   (RAT-03–05)
Annual premium  = Base premium + Σ add-on premiums                                                     (RAT-06, RAT-07)
Term premium    = Annual premium × term × (1 − TERM_DISC)                                               (RAT-08)
GST             = 0%                                                                                     (RAT-09)</div></div>
 <div class="section"><h2>Worked example</h2><p class="lede">Self 34, Spouse 32, Son 4 · Bengaluru (Zone A) · ${p.selPk.t.name} ${siL(p.si)} · 1 year · no add-ons. Calculated by the same engine as the live quote.</p>
 <div class="tbl-wrap"><table><thead><tr><th>Step</th><th>Calculation</th><th class="r">Amount</th></tr></thead><tbody>
 ${r.rows.map(x=>`<tr><td>${x.m.r.n} ${x.m.age} (${x.m.band.code})</td><td class="mono">${fmt(x.m.band.base)} × ${C.siFactor[p.si]} × ${tierOf(p.tier).factor}</td><td class="r num">${fmt(x.prem)}</td></tr>`).join('')}
 <tr><td>Floater, 3 members</td><td class="mono">${fmt(r.sum)} × ${r.ff}</td><td class="r num">${fmt(r.sum*r.ff)}</td></tr>
 <tr><td>Zone A</td><td class="mono">× ${r.zf}</td><td class="r num">${fmt(r.base)}</td></tr>
 <tr><td><b>Annual premium</b></td><td>GST 0%</td><td class="r num"><b>${fmt(p.annual)}</b></td></tr></tbody></table></div></div>
 <div class="section"><h2>Rate tables</h2><div class="grid2">${RAT_TABLES.map(t=>`<div style="display:grid;gap:6px;align-content:start;min-width:0"><div><b class="mono">${t[0]}</b> <span class="muted" style="font-size:12.5px">${esc(t[1])}</span></div>${table(t[2],t[3].map(r=>r.map(c=>esc(c))))}</div>`).join('')}</div></div>
 <div class="section"><h2>Indicative rate card: individual, Advantage, Zone B, no loadings</h2>
 ${table(['Age','₹10 L','₹15 L','₹25 L','₹50 L'],[25,35,45,55,65].map(a=>[String(a),...[10,15,25,50].map(s=>fmt(bandOf(a).base*C.siFactor[s*L]*1.2))]))}</div>`;
}
function renderRefine(){
 const tag=t=>`<span class="pill ${t==='certain'?'p-good':t==='likely'?'p-warn':'p-bad'}">${t}</span>`;
 return `<div class="section"><h2>Refinements to the Apex source</h2><p class="lede">${REFINE.length} changes. Each one fixes a gap or conflict that would stop configuration or break the NxSure scenario. The tag shows confidence in the reasoning.</p>
 ${table(['#','Issue in the source','Decision','Why','Confidence'],REFINE.map(r=>[`<span class="mono">${r[0]}</span>`,esc(r[1]),esc(r[2]),esc(r[3]),tag(r[4])]))}</div>
 <div class="section"><h2>Open items to confirm before build</h2>${table(['#','Owner','Question','Impact'],OPEN.map(o=>[`<span class="mono">${o[0]}</span>`,o[1],esc(o[2]),esc(o[3])]))}</div>
 <div class="section"><h2>Regulatory points used in the configuration</h2>
 ${table(['Point','Configured as','Confidence'],[
  ['PED waiting period capped at 36 months; moratorium 60 months','CLM-03, UW-16, identity','certain'],
  ['Free-look 30 days','Product identity','likely'],
  ['GST 0% on individual and floater health premiums from 22 Sep 2025','RAT-09','likely'],
  ['Senior citizen premium increase capped at 10% a year without IRDAI consultation','RAT-10, UW-13','likely'],
  ['Cashless pre-authorisation within 1 hour, final authorisation within 3 hours','CLM-06','certain'],
  ['No decline solely on mental illness, HIV/AIDS or disability','UW-10, UW-11, UW-12','certain'],
  ['Insurer bears at least 50% of pre-policy check-up cost if the proposal is accepted','Open item O7','likely']].map(r=>[esc(r[0]),r[1],tag(r[2])]))}
 <div class="note">Confirm each regulatory point against the current IRDAI master circular before the product is filed. These tags reflect source documents and market knowledge, not a legal review.</div></div>`;
}
function route(){
 const id=(location.hash||'#demo').slice(1);const tab=TABS.find(t=>t[0]===id)?id:'demo';
 document.getElementById('tabs').innerHTML=TABS.map(t=>`<a href="#${t[0]}" ${t[0]===tab?'aria-current="page"':''}>${t[1]}</a>`).join('');
 const m=document.getElementById('main');
 if(tab==='demo'){prev=null;renderDemo(true);}
 else m.innerHTML=({flow:renderFlow,identity:renderIdentity,tree:renderTree,fields:renderFields,codes:renderCodes,rules:renderRules,rating:renderRating,refine:renderRefine})[tab]();
 window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
 const c=e.target.closest('#dd-chips .chip');if(c){document.querySelectorAll('#dd-chips .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));document.getElementById('dd-t').innerHTML=ddTable(c.dataset.lv);}
 const r=e.target.closest('#r-chips .chip');if(r){document.querySelectorAll('#r-chips .chip').forEach(x=>x.setAttribute('aria-pressed',x===r));document.getElementById('r-t').innerHTML=rulesTable(r.dataset.set,document.getElementById('r-q').value);}
});
document.addEventListener('input',e=>{if(e.target.id==='r-q'){const a=document.querySelector('#r-chips .chip[aria-pressed="true"]');document.getElementById('r-t').innerHTML=rulesTable(a?a.dataset.set:'',e.target.value);}});
window.addEventListener('hashchange',route);
route();
</script>
